<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekomendasi Pembelian Rumah Hunian</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="bp-card-shell">
        <div class="bp-header">
          <p class="bp-eyebrow">Sistem Pendukung Keputusan</p>
          <h1 class="bp-title">Rekomendasi Pembelian Rumah Hunian</h1>
          <p class="bp-subtitle">Metode Profile Matching &amp; Analytical Hierarchy Process</p>
        </div>

        <div class="bp-form-body">
          <form action="/rekomendasi" method="post">

            <p class="bp-section-label">Data Utama</p>

            <div class="mb-3 bp-field">
              <label class="form-label">Harga maksimal (Rp)</label>
              <input type="number" step="1000000" class="form-control" name="harga_maks" placeholder="contoh: 500000000" required>
            </div>

            <div class="mb-3 bp-field">
              <label class="form-label">Kota / Kabupaten yang diinginkan</label>
              <select class="form-select" name="kota" required>
                {% for kota in daftar_kota %}
                <option value="{{ kota }}">{{ kota }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3 bp-field">
                <label class="form-label">Minimal jumlah kamar tidur</label>
                <input type="number" min="1" class="form-control" name="kamar_tidur_min" value="2" required>
              </div>
              <div class="col-md-6 mb-3 bp-field">
                <label class="form-label">Minimal jumlah kamar mandi</label>
                <input type="number" min="1" class="form-control" name="kamar_mandi_min" value="1" required>
              </div>
            </div>

            <div class="mb-3 bp-field">
              <label class="form-label">Minimal luas bangunan (m&sup2;)</label>
              <input type="number" step="1" class="form-control" name="luas_bangunan_min" placeholder="contoh: 60" required>
            </div>

            <p class="bp-section-label">Preferensi Tambahan</p>

            <div class="mb-3 bp-field">
              <label class="form-label">Maksimal jarak dari pusat kota (km)</label>
              <input type="number" step="1" class="form-control" name="jarak_maks_pusat_kota_km" value="10" required>
              <div class="form-hint">Dipakai untuk menilai kriteria aksesibilitas.</div>
            </div>

            <div class="mb-3 bp-field">
              <label class="form-label">Kategori pekerjaan</label>
              <select class="form-select" name="kategori_pekerjaan" required>
                <option value="buruh">Buruh</option>
                <option value="asn">ASN</option>
                <option value="pengusaha">Pengusaha</option>
              </select>
            </div>

            <button type="submit" class="bp-submit">Cari Rekomendasi Rumah</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
